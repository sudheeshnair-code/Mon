---
- name: Install and Configure Prometheus & Grafana
  hosts: test_server
  become: yes
  gather_facts: no

  tasks:

  - name: Create Grafana configuration directories
    file:
      path: "{{ item }}"
      state: directory
      owner: grafana
      group: grafana
      mode: "0755"
    loop:
      - /etc/grafana
      - /etc/grafana/provisioning
      - /etc/grafana/provisioning/dashboards
      - /etc/grafana/provisioning/datasources
      - /var/lib/grafana
      - /var/lib/grafana/dashboards
      - /var/log/grafana
