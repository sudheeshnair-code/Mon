  ###############################################################
# Dashboard Provisioning
###############################################################

  - name: Create Dashboard Directory
    file:
      path: /var/lib/grafana/dashboards
      state: directory
      owner: grafana
      group: grafana
      mode: "0755"
  
  - name: Copy Dashboard JSON
    template:
      src: template/grafana-dashboard.json.j2
      dest: /var/lib/grafana/dashboards/linux.json
      owner: grafana
      group: grafana
      mode: "0644"
  
  - name: Copy Dashboard Provider
    copy:
      src: grafana-dashboard.yml
      dest: /opt/grafana/conf/provisioning/dashboards/dashboard.yml
      owner: grafana
      group: grafana
      mode: "0644"
  
  ###############################################################
  # Datasource Provisioning
  ###############################################################
  
  - name: Create Prometheus Datasource
    copy:
      dest: /opt/grafana/conf/provisioning/datasources/prometheus.yml
      owner: grafana
      group: grafana
      mode: "0644"
      content: |
        apiVersion: 1
    
        datasources:
          - name: Prometheus
            type: prometheus
            access: proxy
            url: http://localhost:9090
            isDefault: true
  
  - name: Reload systemd
    systemd:
      daemon_reload: yes
  
  ###############################################################
  # Start Services
  ###############################################################
  
  - name: Start Prometheus
    service:
      name: prometheus
      state: started
      enabled: yes
  
  - name: Start Node Exporter
    service:
      name: node_exporter
      state: started
      enabled: yes
  
  - name: Start Grafana
    service:
      name: grafana-server
      state: started
      enabled: yes
