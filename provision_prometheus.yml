---
- name: Install and Configure Prometheus
  hosts: test_server
  # become: true
  gather_facts: true

  vars:
    prometheus_version: "2.55.0"

  tasks:

    ###############################################################
    # Verify systemd
    ###############################################################

    - name: Verify systemd is available
      ansible.builtin.command:
        cmd: systemctl show --property=Version
      changed_when: false

    ###############################################################
    # Install required packages
    ###############################################################

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - tar
        state: present
        enablerepo:
          - baseos
          - appstream
        disablerepo:
          - "*"

    ###############################################################
    # Create Prometheus user
    ###############################################################

    - name: Create Prometheus user
      ansible.builtin.user:
        name: prometheus
        shell: /sbin/nologin
        create_home: false

    ###############################################################
    # Copy Prometheus archive from AAP EE
    ###############################################################

    - name: Copy Prometheus archive to destination
      ansible.builtin.copy:
        src: /runner/artifacts/monitoring/prometheus.tar.gz
        dest: /tmp/prometheus.tar.gz
        mode: "0644"

    ###############################################################
    # Extract Prometheus
    ###############################################################

    - name: Extract Prometheus
      ansible.builtin.unarchive:
        src: /tmp/prometheus.tar.gz
        dest: /opt/
        remote_src: true

    ###############################################################
    # Create Prometheus symlink
    ###############################################################

    - name: Remove existing Prometheus symlink/directory
      ansible.builtin.file:
        path: /opt/prometheus
        state: absent

    - name: Create Prometheus symlink
      ansible.builtin.file:
        src: "/opt/prometheus-{{ prometheus_version }}.linux-amd64"
        dest: /opt/prometheus
        state: link

    ###############################################################
    # Create Prometheus data directory
    ###############################################################

    - name: Create Prometheus data directory
      ansible.builtin.file:
        path: /var/lib/prometheus
        state: directory
        owner: prometheus
        group: prometheus
        mode: "0755"

    ###############################################################
    # Deploy Prometheus configuration
    ###############################################################

    - name: Deploy Prometheus configuration
      ansible.builtin.template:
        src: template/prometheus.yml.j2
        dest: /opt/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: "0644"

    ###############################################################
    # Set ownership
    ###############################################################

    - name: Set Prometheus installation ownership
      ansible.builtin.file:
        path: "/opt/prometheus-{{ prometheus_version }}.linux-amd64"
        owner: prometheus
        group: prometheus
        recurse: true

    - name: Set Prometheus data ownership
      ansible.builtin.file:
        path: /var/lib/prometheus
        owner: prometheus
        group: prometheus
        recurse: true

    ###############################################################
    # Create systemd service
    ###############################################################

    - name: Create Prometheus systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus
          After=network.target

          [Service]
          Type=simple
          User=prometheus
          Group=prometheus
          ExecStart=/opt/prometheus/prometheus \
            --config.file=/opt/prometheus/prometheus.yml \
            --storage.tsdb.path=/var/lib/prometheus
          Restart=always

          [Install]
          WantedBy=multi-user.target

    ###############################################################
    # Reload systemd
    ###############################################################

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    ###############################################################
    # Enable and start Prometheus
    ###############################################################

    - name: Enable and start Prometheus
      ansible.builtin.systemd_service:
        name: prometheus.service
        enabled: true
        state: started

    ###############################################################
    # Remove archive from destination
    ###############################################################

    - name: Remove Prometheus archive
      ansible.builtin.file:
        path: /tmp/prometheus.tar.gz
        state: absent

    ###############################################################
    # Gather service facts
    ###############################################################

    - name: Gather service facts
      ansible.builtin.service_facts:

    ###############################################################
    # Verify Prometheus
    ###############################################################

    - name: Verify Prometheus
      ansible.builtin.assert:
        that:
          - "'prometheus.service' in ansible_facts.services"
          - ansible_facts.services['prometheus.service'].state == 'running'
          - ansible_facts.services['prometheus.service'].status == 'enabled'
        fail_msg: "Prometheus is not running or enabled."
        success_msg: "Prometheus is installed, enabled and running."

    ###############################################################
    # Verify Prometheus process
    ###############################################################

    - name: Check Prometheus process
      ansible.builtin.command:
        cmd: pgrep -a prometheus
      register: prometheus_process
      changed_when: false

    - name: Display Prometheus process
      ansible.builtin.debug:
        var: prometheus_process.stdout_lines

    ###############################################################
    # Summary
    ###############################################################

    - name: Prometheus installation summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - " Prometheus Installation Successful"
          - "=========================================="
          - "Version : {{ prometheus_version }}"
          - "Service : prometheus.service"
          - "Port    : 9090"
          - "Status  : Running"
