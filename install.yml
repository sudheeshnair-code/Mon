## verify services status

  - name: Gather service facts
    service_facts:
    
  - name: Verify Prometheus service is running
    assert:
      that:
        - ansible_facts.services['prometheus.service'].state == 'running'
        - ansible_facts.services['prometheus.service'].status == 'enabled'
      fail_msg: "Prometheus service is not running or not enabled."
      success_msg: "Prometheus is installed, enabled, and running."

  - name: Verify Grafana service is running
    assert:
      that:
        - ansible_facts.services['grafana-server.service'].state == 'running'
        - ansible_facts.services['grafana-server.service'].status == 'enabled'
      fail_msg: "Grafana service is not running or not enabled."
      success_msg: "Grafana is installed, enabled, and running."

  - name: Verify Node Exporter service is running
    assert:
      that:
        - ansible_facts.services['node_exporter.service'].state == 'running'
        - ansible_facts.services['node_exporter.service'].status == 'enabled'
      fail_msg: "Node Exporter service is not running or not enabled."
      success_msg: "Node Exporter is installed, enabled, and running."

  - name: Monitoring Stack Installation Summary
    debug:
      msg:
        - "========================================="
        - " Monitoring Stack Installed Successfully "
        - "========================================="
        - "✓ Prometheus : Running"
        - "✓ Grafana    : Running"
        - "✓ Node Exporter : Running"
        - ""
        - "Prometheus URL : http://{{ inventory_hostname }}:9090"
        - "Grafana URL    : http://{{ inventory_hostname }}:3000"
        - "Node Exporter  : http://{{ inventory_hostname }}:9100/metrics"

